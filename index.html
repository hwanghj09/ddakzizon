<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16242c"><meta name="description" content="딱, 지존 — 직접 걷고, 접고, 뒤집는 딱지 어드벤처"><title>딱, 지존</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e5b760' d='M2 2h28v28H2z'/%3E%3Cpath stroke='%23795637' d='m2 2 28 28M30 2 2 30'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main id="game" tabindex="-1" aria-label="딱, 지존 게임">
<canvas id="world" aria-label="학교 운동장과 딱지 배틀 장면"></canvas><div class="vignette" aria-hidden="true"></div><div class="film-lines" aria-hidden="true"></div>
<div id="hud" hidden><div class="top-actions"><span id="inventory" class="has-newspaper">신문지 딱지 × 1</span><button id="open-inventory" aria-label="인벤토리 열기 (I)" title="인벤토리 (I)">▦</button><button id="sound" aria-label="소리 끄기" title="소리 켜기/끄기">♪</button><button id="fullscreen" aria-label="전체 화면" title="전체 화면">⛶</button><button id="pause" aria-label="게임 메뉴 열기 (Esc)" title="게임 메뉴 (Esc)">☰</button></div></div>
<section id="title-screen" class="title-screen"><div class="title-copy"><h1>딱<span>,</span><br>지존<span class="title-dot">.</span></h1><div class="title-menu"><button id="new-game" class="menu-primary">처음부터 시작 <span>↗</span></button><button id="load-game" class="menu-secondary" disabled>이어서 하기 <span>→</span></button><button id="open-settings" class="menu-secondary">설정 <span>⚙</span></button></div></div><section id="name-entry" class="name-entry panel" hidden role="dialog" aria-labelledby="name-entry-heading"><h2 id="name-entry-heading">주인공 이름</h2><p>대사에 나올 이름을 정하자. 최대 8글자 · 비워 두면 ‘주인공’.</p><input id="hero-name" type="text" maxlength="8" autocomplete="off" spellcheck="false" aria-label="주인공 이름 (최대 8글자)"><div class="name-actions"><button id="name-confirm" class="menu-primary">이 이름으로 시작 <span>↗</span></button><button id="name-cancel" class="menu-secondary">뒤로 <kbd>Esc</kbd></button></div></section><section id="title-settings" class="title-settings panel" hidden role="dialog" aria-labelledby="title-settings-heading"><header><h2 id="title-settings-heading">설정</h2><button id="close-settings" class="menu-secondary">닫기 <kbd>Esc</kbd></button></header><div id="title-settings-body"></div></section></section>
<div id="explore-ui" hidden><div id="map-hud" hidden><span id="map-location"></span><strong id="map-objective"></strong><span id="map-direction"></span></div><div id="touch-controls" class="touch-controls"><div class="touch-move"><button id="touch-left" aria-label="왼쪽으로 걷기 (누르고 있기)">◀</button><button id="touch-right" aria-label="오른쪽으로 걷기 (누르고 있기)">▶</button></div><button id="touch-interact" aria-label="상호작용 (E)">상호작용</button></div></div>
<section id="dialogue" class="dialogue panel" hidden aria-label="대화"><div id="portrait" class="portrait"><i></i></div><div class="dialogue-content"><div class="speaker-row"><strong id="speaker"></strong><button id="skip" class="skip" hidden aria-label="이 장면 건너뛰기 (보상과 진행은 그대로)">건너뛰기 ⏭</button></div><p id="line" aria-live="polite"></p><button id="next"><kbd>SPACE</kbd><span>▾</span></button></div></section>
<section id="battle-hud" hidden><div class="health-card player"><span><b id="player-name">나</b> <small>신문지 딱지</small></span><div class="health-track"><i id="player-bar"></i></div><div><small>내구도</small><strong id="player-hp"></strong></div></div><span id="round-label">ROUND 01</span><div class="health-card opponent"><span id="enemy-name">부하 <small>색종이 딱지</small></span><div class="health-track"><i id="enemy-bar"></i></div><div><small>내구도</small><strong id="enemy-hp"></strong></div></div></section>
<section id="combat-controls" class="combat-panel panel" hidden><div class="combat-heading"><strong id="turn-label">나의 차례</strong></div><div id="actions" class="actions"><button id="attack" class="action-primary"><span class="action-icon">↗</span><span>내려치기</span><kbd>SPACE</kbd></button><button id="skill-precise" class="action-secondary skill" hidden><span>정밀 타격 <kbd>R</kbd></span><span class="skill-state"></span></button><button id="skill-smash" class="action-secondary skill" hidden><span>강타 <kbd>C</kbd></span><span class="skill-state"></span></button><button id="skill-press" class="action-secondary skill" hidden><span>꾹 눌러 펴기 <kbd>F</kbd></span><span class="skill-state"></span></button></div><div id="timing" hidden><div id="gauge" class="gauge" role="img" aria-label="가운데부터 완벽, 좋음, 보통 구간. 바깥은 빗나감"><div class="normal-zone"></div><div class="good-zone"></div><div class="perfect-zone"></div><i id="needle"></i></div><div class="gauge-legend" aria-hidden="true"><span class="legend-perfect">완벽 ×1.3</span><span class="legend-good">좋음 ×1.1</span><span class="legend-normal">보통 ×1.0</span><span class="legend-bad">빗나감 ×0.6</span></div><button id="strike" class="strike">내려치기 <kbd>SPACE</kbd></button></div></section>
<section id="fold-controls" class="fold-controls panel" hidden><p id="fold-hint" role="status"></p><div class="fold-buttons"><button data-fold="0">↘ <kbd>1</kbd></button><button data-fold="1">↖ <kbd>2</kbd></button><button data-fold="2">↙ <kbd>3</kbd></button><button data-fold="3">↗ <kbd>4</kbd></button></div></section>
<section id="result" class="result panel" hidden><h2 id="result-title"></h2><p id="result-text"></p><div id="result-stats"></div><button id="continue" class="menu-primary"></button><button id="result-secondary" class="menu-secondary" hidden></button><div id="result-extra" class="result-extra"></div></section>
<section id="facility" class="facility panel" hidden aria-labelledby="facility-title"><header><h2 id="facility-title"></h2><span id="facility-wallet"></span></header><div id="facility-content"></div><button id="facility-close" class="menu-secondary">밖으로 나가기 <kbd>E</kbd></button></section>
<div id="impact" class="impact" aria-live="polite"></div><div id="toast" class="toast" role="status"></div><section id="credits" class="credits" hidden aria-label="엔딩 크레딧"><div id="credits-roll" class="credits-roll"></div><button id="credits-skip" class="menu-secondary credits-skip">건너뛰기</button></section><div id="chapter-card" class="chapter-card" hidden><span id="card-kicker"></span><h2 id="card-title"></h2><p id="card-subtitle"></p></div><div id="curtain" class="curtain"></div>
<div id="pause-screen" class="modal-backdrop" hidden>
<section class="game-menu panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
 <aside class="menu-sidebar"><h2 id="pause-title">메뉴</h2><nav aria-label="게임 메뉴">
  <button data-menu="overview">게임 현황</button><button data-menu="inventory">인벤토리 <kbd>I</kbd></button><button data-menu="map">동네 지도 <kbd>M</kbd></button><button data-menu="journal">이야기 수첩 <kbd>J</kbd></button><button data-menu="story">이야기 다시 보기</button><button data-menu="achievements">도전 과제</button><button data-menu="player">선수 · 스킬</button><button data-menu="settings">설정</button><button data-menu="controls">조작키</button>
 </nav><div class="menu-sidebar-bottom"><button id="resume" class="menu-primary">계속 플레이 <span>▶</span></button><button id="return-title" class="menu-secondary">타이틀로 돌아가기</button></div></aside>
 <div class="menu-main"><header class="menu-header"><h3 id="menu-view-title">게임 현황</h3><button id="menu-close" aria-label="메뉴 닫고 계속 플레이">닫기 <span aria-hidden="true">×</span></button></header><div id="menu-body"></div><p id="menu-message" role="status" aria-live="polite"></p></div>
</section></div>
</main><script src="rules.js"></script><script src="journey-data.js"></script><script src="progression.js"></script><script src="story-data.js"></script><script src="game.js"></script><script src="school.js"></script><script src="village.js"></script><script src="city.js"></script><script src="tournament.js"></script><script src="stages.js"></script><script src="ending.js"></script><script src="forge.js"></script><script src="journeys.js"></script><script src="menus.js"></script><script src="exploration.js"></script><script src="map-renderer.js"></script><script src="world.js"></script></body></html>
