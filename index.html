<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#16242c"><meta name="description" content="딱, 지존 — 직접 걷고, 접고, 뒤집는 딱지 어드벤처"><title>딱, 지존</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23e5b760' d='M2 2h28v28H2z'/%3E%3Cpath stroke='%23795637' d='m2 2 28 28M30 2 2 30'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main id="game" tabindex="-1" aria-label="딱, 지존 게임">
<canvas id="world" aria-label="학교 운동장과 딱지 배틀 장면"></canvas><div class="vignette" aria-hidden="true"></div><div class="film-lines" aria-hidden="true"></div>
<div id="hud" hidden><div class="top-actions"><span id="inventory" class="has-newspaper">신문지 딱지 × 1</span><button id="open-inventory" aria-label="인벤토리 열기 (I)" title="인벤토리 (I)">▦</button><button id="sound" aria-label="소리 끄기" title="소리 켜기/끄기">♪</button><button id="fullscreen" aria-label="전체 화면" title="전체 화면">⛶</button><button id="pause" aria-label="게임 메뉴 열기 (Esc)" title="게임 메뉴 (Esc)">☰</button></div></div>
<section id="title-screen" class="title-screen"><div class="title-copy"><h1>딱<span>,</span><br>지존<span class="title-dot">.</span></h1><div class="title-menu"><button id="new-game" class="menu-primary">처음부터 시작 <span>↗</span></button><button id="load-game" class="menu-secondary" hidden>이어서 하기 <span>→</span></button></div></div></section>
<div id="explore-ui" hidden><div id="map-hud" hidden><span id="map-location"></span><strong id="map-objective"></strong><span id="map-direction"></span></div></div>
<section id="dialogue" class="dialogue panel" hidden aria-label="대화"><div id="portrait" class="portrait"><i></i></div><div class="dialogue-content"><div class="speaker-row"><strong id="speaker"></strong></div><p id="line" aria-live="polite"></p><button id="next"><kbd>SPACE</kbd><span>▾</span></button></div></section>
<section id="battle-hud" hidden><div class="health-card player"><span>나 <small>신문지 딱지</small></span><div class="health-track"><i id="player-bar"></i></div><div><small>내구도</small><strong id="player-hp"></strong></div></div><span id="round-label">ROUND 01</span><div class="health-card opponent"><span id="enemy-name">부하 <small>색종이 딱지</small></span><div class="health-track"><i id="enemy-bar"></i></div><div><small>내구도</small><strong id="enemy-hp"></strong></div></div></section>
<section id="combat-controls" class="combat-panel panel" hidden><div class="combat-heading"><strong id="turn-label">나의 차례</strong></div><div id="actions" class="actions"><button id="attack" class="action-primary"><span class="action-icon">↗</span><span>내려치기</span><kbd>SPACE</kbd></button><button id="focus" class="action-secondary" disabled><span>집중</span><span id="focus-count">잠김</span></button><button id="guard" class="action-secondary" hidden><span>뿌리 버티기</span><kbd>R</kbd></button><button id="power" class="action-secondary" hidden><span>승부수 <kbd>C</kbd></span><span id="power-count">1 / 1</span></button></div><div id="timing" hidden><div id="gauge" class="gauge" role="img" aria-label="밝은 중앙 구간에서 멈추면 PERFECT"><div class="good-zone"></div><div class="perfect-zone"></div><i id="needle"></i></div><button id="strike" class="strike">내려치기 <kbd>SPACE</kbd></button></div></section>
<section id="fold-controls" class="fold-controls panel" hidden><p id="fold-hint" role="status"></p><div class="fold-buttons"><button data-fold="0">↘ <kbd>1</kbd></button><button data-fold="1">↖ <kbd>2</kbd></button><button data-fold="2">↙ <kbd>3</kbd></button><button data-fold="3">↗ <kbd>4</kbd></button></div></section>
<section id="home-workbench" class="home-workbench panel" hidden aria-labelledby="home-workbench-title"><h2 id="home-workbench-title">첫 번째 강화</h2><p id="home-item-name"></p><div id="home-stat-preview" class="home-stat-preview"></div><p id="home-wallet"></p><button id="home-compress" class="menu-primary">보강하고 압축하기</button><button id="home-practice" class="menu-primary" hidden>타이밍 연습하기 →</button><p id="home-upgrade-note" role="status"></p></section>
<section id="result" class="result panel" hidden><h2 id="result-title"></h2><p id="result-text"></p><div id="result-stats"></div><button id="continue" class="menu-primary"></button><button id="result-secondary" class="menu-secondary" hidden></button></section>
<section id="facility" class="facility panel" hidden aria-labelledby="facility-title"><header><h2 id="facility-title"></h2><span id="facility-wallet"></span></header><div id="facility-content"></div><button id="facility-close" class="menu-secondary">밖으로 나가기 <kbd>E</kbd></button></section>
<div id="impact" class="impact" aria-live="polite"></div><div id="toast" class="toast" role="status"></div><div id="chapter-card" class="chapter-card" hidden><span id="card-kicker"></span><h2 id="card-title"></h2><p id="card-subtitle"></p></div><div id="curtain" class="curtain"></div>
<div id="pause-screen" class="modal-backdrop" hidden>
<section class="game-menu panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
 <aside class="menu-sidebar"><h2 id="pause-title">메뉴</h2><nav aria-label="게임 메뉴">
  <button data-menu="overview">게임 현황</button><button data-menu="inventory">인벤토리 <kbd>I</kbd></button><button data-menu="map">동네 지도 <kbd>M</kbd></button><button data-menu="journal">이야기 수첩 <kbd>J</kbd></button><button data-menu="achievements">도전 과제</button><button data-menu="player">선수 · 스킬</button><button data-menu="settings">설정</button><button data-menu="controls">조작키</button>
 </nav><div class="menu-sidebar-bottom"><button id="resume" class="menu-primary">계속 플레이 <span>▶</span></button><button id="return-title" class="menu-secondary">타이틀로 돌아가기</button></div></aside>
 <div class="menu-main"><header class="menu-header"><h3 id="menu-view-title">게임 현황</h3><button id="menu-close" aria-label="메뉴 닫고 계속 플레이">닫기 <span aria-hidden="true">×</span></button></header><div id="menu-body"></div><p id="menu-message" role="status" aria-live="polite"></p></div>
</section></div>
</main><script src="rules.js"></script><script src="journey-data.js"></script><script src="progression.js"></script><script src="game.js"></script><script src="school.js"></script><script src="village.js"></script><script src="city.js"></script><script src="province.js"></script><script src="national.js"></script><script src="frontier.js"></script><script src="forge.js"></script><script src="journeys.js"></script><script src="menus.js"></script><script src="exploration.js"></script><script src="map-renderer.js"></script><script src="world.js"></script></body></html>
